version: '3.8'

services:
  # Base de Datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: smartlogix-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    volumes:
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smartlogix-network
    restart: unless-stopped

  # Microservicio de Inventario
  ms-inventario:
    build:
      context: .
      dockerfile: ms-inventario/Dockerfile
    container_name: smartlogix-ms-inventario
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smartlogix_inventory
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres_password
    depends_on:
      - postgres
    networks:
      - smartlogix-network
    restart: unless-stopped

  # Microservicio de Pedidos
  ms-pedidos:
    build:
      context: .
      dockerfile: ms-pedidos/Dockerfile
    container_name: smartlogix-ms-pedidos
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smartlogix_orders
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres_password
      INVENTORY_URL: http://ms-inventario:8081
    depends_on:
      - postgres
      - ms-inventario
    networks:
      - smartlogix-network
    restart: unless-stopped

  # Microservicio de Envíos
  ms-envios:
    build:
      context: .
      dockerfile: ms-envios/Dockerfile
    container_name: smartlogix-ms-envios
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smartlogix_shipping
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres_password
    depends_on:
      - postgres
    networks:
      - smartlogix-network
    restart: unless-stopped

  # Backend For Frontend - API Gateway
  bff-gateway:
    build:
      context: .
      dockerfile: bff-gateway/Dockerfile
    container_name: smartlogix-bff-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://ms-inventario:8081
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: http://ms-pedidos:8082
      SPRING_CLOUD_GATEWAY_ROUTES_2_URI: http://ms-envios:8083
      JWT_SECRET: "defaultsecretkeyplaceholderformicros32chars"
    depends_on:
      - ms-inventario
      - ms-pedidos
      - ms-envios
    networks:
      - smartlogix-network
    restart: unless-stopped

  # Frontend React/Vite
  frontend:
    build:
      context: ../SmartLogixFrontend
      dockerfile: Dockerfile
    container_name: smartlogix-frontend
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:8080/api/v1
    depends_on:
      - bff-gateway
    networks:
      - smartlogix-network
    restart: unless-stopped

networks:
  smartlogix-network:
    driver: bridge

volumes:
  postgres_data:
